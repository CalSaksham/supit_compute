deal: zorbe-lambda-live
buyer: Zorbe (demo)
provider: Lambda
provider_id: lambda
cluster: {gpus: 8, sku: H100-SXM-80GB, nodes: 1}
environment:
  mode: live
  stand_in: Three local Ollama servers on this Mac play Lambda, CoreWeave and Together AI
workload: {type: inference, serves: customer-owned specialized models, model: 'gemma3:4b', model_digest: a2af6cc3eb7f}
price_per_gpu_hour: 2.20
handover:
  bar: live/data/bar.json
  compute_vs_bar: '>= 0.90'
  memory_bandwidth_vs_bar: '>= 0.90'
  burn_in_seconds: 15
  require: {model_digest_match: true, single_listener: true}
performance:
  # Calibrated on an M4 Pro: healthy ~29 tokens/s under demo load (~72 alone); throttled ~5 under load (~12 alone).
  output_tokens_per_sec: '>= 17'
  p95_latency_ms: '<= 3000'
  measured_by: gateway
  window_seconds: 20
delivery:
  definition: handover_passed
  grace_days: 3
  late_credit_per_day: 0.01   # share of one month's bill, per day late after the grace period
  walk_away_after_days: 14
  cover: seller_pays_replacement_premium
  milestones: [gpu_serials_registered, racks_powered, network_cabled, early_access_burn_in]
  runner_up: {provider: CoreWeave, held_until: handover}
uptime_target: 0.99
holdback: {share_of_invoice: 0.10, held_by: buyer}
credits:
  downtime: {rate: full_price, basis: all_gpus_serving_the_model}
  slow: {rate: half_price, basis: all_gpus_serving_the_model, while: below_performance_floor}
rescue: {paid_by: provider_on_provider_fault}
backup: {secondary: CoreWeave, serverless: Together AI}
# Demo estimates only; replace these with the actual backup deal and API rate.
demo_backup_pricing: {secondary_per_gpu_hour: 2.95, serverless_per_million_tokens: 0.20, tokens_per_request: 48}
